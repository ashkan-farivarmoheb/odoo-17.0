version: '3.1'

services:
  wiremock:
    image: "wiremock/wiremock:latest"
    ports:
      - "8887:8080"
      - "8443:8443"
    volumes:
      - ../test/stubdata:/home/wiremock

  db:
    image: postgres:15
    container_name: db_container
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    container_name: redis_container
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always
    ports:
      - "6379:6379"

  odoo:
    image: odoo:17.0
    container_name: odoo
    depends_on:
      - db
      - redis
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - odoo_data:/var/lib/odoo
      - ../addons:/mnt/extra-addons

volumes:
  pg_data:
  odoo_data:
