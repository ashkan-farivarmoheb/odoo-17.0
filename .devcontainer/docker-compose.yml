version: '3.1'
services:
  odoo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: odoo_container
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./extra-addons:/mnt/extra-addons
      - ./resources/odoo.conf:/etc/odoo/odoo.conf

  db:
    image: postgres:15
    container_name: db_container
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
