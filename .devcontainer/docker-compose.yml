version: '3.1'
services:

  docker:
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - dind-var-lib-docker:/var/lib/docker

  odoo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: odoo_container
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    depends_on:
      - db
      - docker
    ports:
      - "8069:8069"
    volumes:
      - ../extra-addons:/mnt/extra-addons
      - ../resources/odoo-local.conf:/etc/odoo/odoo.conf

  db:
    image: postgres:15
    container_name: db_container
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  dind-var-lib-docker:
