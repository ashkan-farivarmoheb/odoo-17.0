[newrelic]
# License key (Keep this unchanged)
license_key = a2758340de00c85d9b82b93246d1114cFFFFNRAL

# Application name
app_name = odoo-17.0-develop

# Logging level (Reduce logging to avoid overhead)
log_level = info  # Change from 'debug' to 'info'

# Disable problematic instrumentations
instrumentation.ssl = false
instrumentation.requests = false
instrumentation.gevent = false
instrumentation.urllib3 = false
instrumentation.asyncio = false
instrumentation.socket = false

# Monitor mode (Must be true for APM)
monitor_mode = true

# SSL settings
ssl = true

# Distributed tracing (If not needed, disable it)
distributed_tracing.enabled = false  # Change to 'false' to reduce overhead

# Transaction tracer settings
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = 1.0  # Increase to avoid capturing all transactions
transaction_tracer.record_sql = obfuscated  # Change from 'raw' to 'obfuscated' to reduce DB logging overhead
transaction_tracer.stack_trace_threshold = 1.0  # Increase to avoid excessive stack tracing
transaction_tracer.explain_enabled = false  # Disable EXPLAIN queries to reduce DB load
transaction_tracer.explain_threshold = 3.0  # Only log slow queries > 1 sec

# Error collector settings
error_collector.enabled = true
error_collector.ignore_errors =

# Cross Application Tracing (Disable if not needed)
cross_application_tracer.enabled = false  # Change to 'false' to reduce communication overhead

# Thread profiler (Disable if not debugging performance)
thread_profiler.enabled = false  # Change to 'false' to avoid thread profiling overhead

# Import hook configuration
import_hook.enabled = false

# Debugging (Disable unnecessary debug logs)
debug.log_data_collector_calls = false
debug.log_transaction_trace_payload = false
debug.log_thread_profile_payload = false
debug.local_settings_overrides = false

# ---------------------------------------------------------------------------

# The application environments
[newrelic:develop]
monitor_mode = true

[newrelic:sit]
monitor_mode = true

[newrelic:stg]
monitor_mode = true

[newrelic:prod]
monitor_mode = true
